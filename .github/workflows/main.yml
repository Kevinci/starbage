name: Deploy Nuxt 3 App to GCP via gcloud

on:
  push:
    branches:
      - master  # Trigger deployment on push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '17'

    - name: Install dependencies
      run: npm install

    - name: Build the Nuxt app
      run: npm run generate

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v0
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

    - name: Set up Google Cloud project and compute zone
      run: |
        gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
        gcloud config set compute/zone ${{ secrets.GCP_VM_ZONE }}

    - name: Generate SSH Key (if missing)
      run: |
        if [ ! -f ~/.ssh/google_compute_engine ]; then
          ssh-keygen -t rsa -f ~/.ssh/google_compute_engine -C $USER -N ''
        fi

    - name: Transfer files to GCP VM
      run: |
        gcloud compute scp --recurse ./dist/* ${{ secrets.GCP_VM_NAME }}:$HOME/var/www/html
