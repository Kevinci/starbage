name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

# GITHUB_TOKEN-Rechte für das Pages-Deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Deployments nicht abbrechen, aber nur eines gleichzeitig
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          # Project Pages liegen unter /<repo>/ - Nuxt muss alle Pfade damit präfixen
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}/
        run: npm run generate

      - name: Disable Jekyll processing
        run: touch .output/public/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
